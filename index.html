<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Team Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#1C2533; --muted:#566275; --line:#D3DAE3;
  --slides:#A8660F; --slides-bg:#FBF0DE; --sound:#17706F; --sound-bg:#DFF1F0;
  --alert:#B8324B; --alert-bg:#FBE5E9; --focus:#3A5BD9;
  --font:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#121821; --surface:#1B232F; --ink:#E6EBF2; --muted:#9AA6B8; --line:#2D3848;
    --slides:#F0B256; --slides-bg:#36291A; --sound:#62C9C4; --sound-bg:#153230;
    --alert:#F2849A; --alert-bg:#3B1C24; --focus:#8EA6FF;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;line-height:1;margin:0;letter-spacing:-.02em}
h1 small{display:block;font-size:1rem;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:8px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
label.who{display:flex;align-items:center;gap:8px;font-weight:600}
select,button{font:inherit;color:inherit}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:120px}
.monthnav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
.monthnav span{min-width:140px;text-align:center;font-weight:600}
.icon{background:none;border:0;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:1.1rem}
.icon:hover{background:var(--bg)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
section{margin-top:36px}
h2{font-size:1.35rem;font-weight:600;margin:0 0 4px}
.hint{color:var(--muted);margin:0 0 14px;max-width:62ch}
.sectionhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.sectionhead .hint{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--alert-bg);border-color:var(--alert);color:var(--alert);font-weight:600;text-decoration:line-through}
.primary{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer}
.primary:hover{opacity:.9}
.ghost{background:none;border:1px solid currentColor;border-radius:6px;padding:4px 10px;font-size:.875rem;cursor:pointer}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:24px;color:var(--muted)}
.day{display:grid;grid-template-columns:88px 1fr 1fr;gap:10px;align-items:stretch;padding:12px 0;border-top:1px solid var(--line)}
.day:last-child{border-bottom:1px solid var(--line)}
.date{display:flex;flex-direction:column;justify-content:center}
.date b{font-size:2.6rem;font-weight:800;line-height:.9;letter-spacing:-.03em}
.date span{color:var(--muted);font-size:.85rem}
.slot{border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;border-left:5px solid}
.slot.slides{background:var(--slides-bg);border-color:var(--slides)}
.slot.sound{background:var(--sound-bg);border-color:var(--sound)}
.slot .pos{font-size:.8rem;font-weight:600}
.slot.slides .pos{color:var(--slides)}
.slot.sound .pos{color:var(--sound)}
.slot .name{font-size:1.15rem;font-weight:600}
.slot.mine .name::after{content:" (you)";font-weight:400;color:var(--muted);font-size:.9rem}
.slot .none{color:var(--muted);font-style:italic}
.note{font-size:.85rem;color:var(--muted)}
.note.alert{color:var(--alert);font-weight:600}
.slot .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.slot.cover{outline:2px dashed var(--alert);outline-offset:-2px}
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:10px;overflow:hidden}
.tablewrap{overflow-x:auto}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{font-weight:600;font-size:.9rem;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums}
tr.me td{font-weight:600}
.banner{background:var(--slides-bg);border:1px solid var(--slides);border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:.95rem}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
#toast.err{background:var(--alert);color:#fff}
@media (max-width:600px){
  .day{grid-template-columns:1fr 1fr}
  .date{grid-column:1/-1;flex-direction:row;align-items:baseline;gap:10px}
  .date b{font-size:2rem}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div id="banner"></div>
  <header>
    <h1>Media Team<small>Sunday slides and sound</small></h1>
    <div class="controls">
      <label class="who">I'm
        <select id="user"><option value="">Choose your name</option></select>
      </label>
      <div class="monthnav">
        <button class="icon" id="prev" aria-label="Previous month">‹</button>
        <span id="monthLabel"></span>
        <button class="icon" id="next" aria-label="Next month">›</button>
      </div>
    </div>
  </header>

  <section>
    <h2>Sundays you'll be away</h2>
    <p class="hint" id="awayHint">Choose your name above to mark your Sundays off.</p>
    <div class="chips" id="chips"></div>
  </section>

  <section>
    <div class="sectionhead">
      <div>
        <h2>Schedule</h2>
        <p class="hint">Two people each Sunday, one on slides and one on sound.</p>
      </div>
      <button class="primary" id="generate">Create schedule</button>
    </div>
    <div id="schedule"></div>
  </section>

  <section>
    <h2>Balance</h2>
    <p class="hint">Shifts served across every month so far. New schedules even these out.</p>
    <div class="tablewrap"><table id="balance"></table></div>
  </section>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
/* ============================================================
   1. FIREBASE SETUP
   Paste your Firebase web config here (see setup steps).
   Until you do, the app runs in demo mode and only saves
   data in this one browser.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCJmxNcySq3bNaizMXQm-2XpQ8tdyM6qZM",
  authDomain: "media-team-schedule.firebaseapp.com",
  projectId: "media-team-schedule",
  storageBucket: "media-team-schedule.firebasestorage.app",
  messagingSenderId: "34767744283",
  appId: "1:34767744283:web:3e5d0271f7b15c79e137be"
};

/* 2. TEAM — edit names here */
const PEOPLE = ["Tony", "Sarah", "Billy", "James", "Airi"];
const POSITIONS = [{ key: "slides", label: "Slides" }, { key: "sound", label: "Sound" }];

const USE_FIREBASE = !firebaseConfig.apiKey.startsWith("PASTE");
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");

/* ---------- Dates ---------- */
const monthKeyOf = (y, m) => `${y}-${pad(m + 1)}`;
function sundaysOf(key) {
  const [y, m] = key.split("-").map(Number);
  const d = new Date(y, m - 1, 1);
  while (d.getDay() !== 0) d.setDate(d.getDate() + 1);
  const out = [];
  while (d.getMonth() === m - 1) {
    out.push(`${y}-${pad(m)}-${pad(d.getDate())}`);
    d.setDate(d.getDate() + 7);
  }
  return out;
}
function shiftMonth(key, delta) {
  const [y, m] = key.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return monthKeyOf(d.getFullYear(), d.getMonth());
}
const toDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtMonth = key => toDate(key + "-01").toLocaleDateString(undefined, { month: "long", year: "numeric" });
const fmtShort = s => toDate(s).toLocaleDateString(undefined, { month: "short", day: "numeric" });

/* ---------- Storage ---------- */
function setPath(obj, path, value) {
  const parts = path.split(".");
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (typeof o[parts[i]] !== "object" || o[parts[i]] === null) o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length - 1]] = value;
}

function localStore() {
  const KEY = "mediaTeamSchedule.v1";
  const subs = new Set();
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const emit = () => { const d = read(); subs.forEach(cb => cb(d)); };
  window.addEventListener("storage", e => { if (e.key === KEY) emit(); });
  return {
    subscribe(cb) { subs.add(cb); cb(read()); },
    async update(monthKey, paths) {
      const all = read();
      all[monthKey] = all[monthKey] || {};
      for (const [p, v] of Object.entries(paths)) setPath(all[monthKey], p, v);
      localStorage.setItem(KEY, JSON.stringify(all));
      emit();
    }
  };
}

async function firebaseStore() {
  const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const db = fs.getFirestore(appMod.initializeApp(firebaseConfig));
  return {
    subscribe(cb) {
      fs.onSnapshot(fs.collection(db, "months"),
        snap => { const all = {}; snap.forEach(d => { all[d.id] = d.data(); }); cb(all); },
        err => toast("Couldn't load the schedule: " + err.message, true));
    },
    async update(monthKey, paths) {
      const ref = fs.doc(db, "months", monthKey);
      try { await fs.updateDoc(ref, paths); }
      catch (e) {
        if (e.code !== "not-found") throw e;
        await fs.setDoc(ref, {}, { merge: true });
        await fs.updateDoc(ref, paths);
      }
    }
  };
}

/* ---------- Scheduling ---------- */
function tally(all, excludeKey) {
  const t = Object.fromEntries(PEOPLE.map(p => [p, { slides: 0, sound: 0, total: 0 }]));
  for (const [k, mo] of Object.entries(all)) {
    if (k === excludeKey) continue;
    for (const day of Object.values(mo.schedule || {})) {
      for (const { key } of POSITIONS) {
        const who = day?.[key]?.person;
        if (who && t[who]) { t[who][key]++; t[who].total++; }
      }
    }
  }
  return t;
}

function buildSchedule(sundays, absences, history) {
  const c = structuredClone(history);
  const month = Object.fromEntries(PEOPLE.map(p => [p, 0]));
  const away = (p, d) => (absences?.[p] || []).includes(d);
  const avail = d => PEOPLE.filter(p => !away(p, d));

  // Fill the hardest Sundays (fewest people available) first
  const order = sundays
    .map(d => ({ d, n: avail(d).length, r: Math.random() }))
    .sort((a, b) => a.n - b.n || a.r - b.r)
    .map(x => x.d);

  const out = {};
  for (const d of order) {
    // Fewest shifts this month first, then fewest all-time, then random
    const pool = avail(d)
      .map(p => ({ p, r: Math.random() }))
      .sort((a, b) => month[a.p] - month[b.p] || c[a.p].total - c[b.p].total || a.r - b.r)
      .map(x => x.p);
    const [a, b] = pool;
    let slides = null, sound = null;
    if (a && b) {
      // Pick the position split that best evens out each person's slides/sound mix
      const cost = (s, o) => Math.abs(c[s].slides + 1 - c[s].sound) + Math.abs(c[o].sound + 1 - c[o].slides);
      const c1 = cost(a, b), c2 = cost(b, a);
      if (c1 < c2 || (c1 === c2 && Math.random() < 0.5)) { slides = a; sound = b; }
      else { slides = b; sound = a; }
    } else if (a) {
      if (c[a].slides <= c[a].sound) slides = a; else sound = a;
    }
    const slot = p => ({ person: p, coverRequested: false, coveredFor: null });
    out[d] = { slides: slot(slides), sound: slot(sound) };
    for (const [pos, p] of [["slides", slides], ["sound", sound]]) {
      if (p) { c[p][pos]++; c[p].total++; month[p]++; }
    }
  }
  return out;
}

// Try many randomized schedules and keep the fairest one
function bestSchedule(sundays, absences, history) {
  let best = null, bestScore = Infinity;
  for (let i = 0; i < 400; i++) {
    const sched = buildSchedule(sundays, absences, history);
    const t = structuredClone(history);
    const m = Object.fromEntries(PEOPLE.map(p => [p, 0]));
    let open = 0;
    for (const day of Object.values(sched)) for (const { key } of POSITIONS) {
      const p = day[key].person;
      if (!p) { open++; continue; }
      t[p][key]++; t[p].total++; m[p]++;
    }
    const spread = o => Math.max(...Object.values(o)) - Math.min(...Object.values(o));
    const totals = Object.fromEntries(PEOPLE.map(p => [p, t[p].total]));
    const mix = PEOPLE.reduce((s, p) => s + (t[p].slides - t[p].sound) ** 2, 0);
    const score = open * 1000 + spread(m) * 100 + spread(totals) * 10 + mix;
    if (score < bestScore) { bestScore = score; best = sched; }
  }
  return best;
}

/* ---------- State & rendering ---------- */
let store;
let all = {};
let user = "";
let monthKey = monthKeyOf(new Date().getFullYear(), new Date().getMonth());
try { user = localStorage.getItem("mediaTeamUser") || ""; } catch {}

const current = () => all[monthKey] || {};
const awayList = (p, mo = current()) => mo.absences?.[p] || [];

function render() {
  $("monthLabel").textContent = fmtMonth(monthKey);
  const sundays = sundaysOf(monthKey);
  const mo = current();

  // Away chips
  $("awayHint").textContent = user
    ? "Tap any Sunday you can't serve. Changes save right away."
    : "Choose your name above to mark your Sundays off.";
  const mine = awayList(user);
  $("chips").innerHTML = user ? sundays.map(d =>
    `<button class="chip" data-action="away" data-date="${d}" aria-pressed="${mine.includes(d)}">${fmtShort(d)}</button>`
  ).join("") : "";

  // Schedule
  const sched = mo.schedule;
  $("generate").textContent = sched ? "Remake schedule" : "Create schedule";
  if (!sched) {
    const who = PEOPLE.filter(p => mo.absences?.[p]).length;
    $("schedule").innerHTML = `<div class="empty">No schedule for ${fmtMonth(monthKey)} yet. ${who} of ${PEOPLE.length} people have marked their Sundays away. Create the schedule once everyone has.</div>`;
  } else {
    $("schedule").innerHTML = sundays.map(d => {
      const day = sched[d] || {};
      const dt = toDate(d);
      return `<div class="day">
        <div class="date"><b>${dt.getDate()}</b><span>${dt.toLocaleDateString(undefined, { month: "short" })} · Sunday</span></div>
        ${POSITIONS.map(({ key, label }) => slotHTML(d, key, label, day[key], day)).join("")}
      </div>`;
    }).join("");
  }

  // Balance
  const t = tally(all, null);
  const thisMonth = tally({ [monthKey]: mo }, null);
  $("balance").innerHTML = `<thead><tr><th>Name</th><th>Slides</th><th>Sound</th><th>Total</th><th>${fmtMonth(monthKey).split(" ")[0]}</th></tr></thead><tbody>` +
    PEOPLE.map(p => `<tr class="${p === user ? "me" : ""}"><td>${p}</td><td class="num">${t[p].slides}</td><td class="num">${t[p].sound}</td><td class="num">${t[p].total}</td><td class="num">${thisMonth[p].total}</td></tr>`).join("") +
    `</tbody>`;
}

function slotHTML(date, pos, label, slot, day) {
  const person = slot?.person || null;
  const isMine = person && person === user;
  const other = POSITIONS.find(p => p.key !== pos).key;
  const userBusy = day[other]?.person === user;
  const userAway = user && awayList(user).includes(date);
  const canTake = user && !isMine && !userBusy && !userAway;
  const cls = ["slot", pos, isMine ? "mine" : "", slot?.coverRequested ? "cover" : ""].join(" ");

  let notes = "", actions = "";
  if (!person) {
    notes = `<span class="note alert">No one available</span>`;
    if (canTake) actions = `<button class="ghost" data-action="take" data-date="${date}" data-pos="${pos}">Take this shift</button>`;
  } else {
    if (slot.coveredFor) notes += `<span class="note">Covering for ${slot.coveredFor}</span>`;
    if (awayList(person).includes(date)) notes += `<span class="note alert">Marked away this Sunday</span>`;
    if (slot.coverRequested) notes += `<span class="note alert">Cover requested</span>`;
    if (isMine && !slot.coverRequested) actions = `<button class="ghost" data-action="request" data-date="${date}" data-pos="${pos}">Request cover</button>`;
    if (isMine && slot.coverRequested) actions = `<button class="ghost" data-action="cancel" data-date="${date}" data-pos="${pos}">Cancel request</button>`;
    if (slot.coverRequested && canTake) actions = `<button class="ghost" data-action="take" data-date="${date}" data-pos="${pos}">Cover this shift</button>`;
  }
  return `<div class="${cls}">
    <span class="pos">${label}</span>
    <span class="name">${person ? person : '<span class="none">Open</span>'}</span>
    ${notes}
    ${actions ? `<div class="actions">${actions}</div>` : ""}
  </div>`;
}

/* ---------- Actions ---------- */
let toastTimer;
function toast(msg, err = false) {
  const el = $("toast");
  el.textContent = msg;
  el.className = "show" + (err ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = "", 2600);
}

async function save(paths, okMsg) {
  try { await store.update(monthKey, paths); if (okMsg) toast(okMsg); }
  catch (e) { toast("Didn't save: " + e.message, true); }
}

document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const { action, date, pos } = btn.dataset;
  const slot = current().schedule?.[date]?.[pos];

  if (action === "away") {
    const list = new Set(awayList(user));
    list.has(date) ? list.delete(date) : list.add(date);
    await save({ [`absences.${user}`]: [...list].sort() }, "Saved");
    const assigned = POSITIONS.some(p => current().schedule?.[date]?.[p.key]?.person === user);
    if (list.has(date) && assigned) toast(`You're scheduled on ${fmtShort(date)}. Request a cover below.`);
  }
  if (action === "request") {
    await save({ [`schedule.${date}.${pos}.coverRequested`]: true }, "Cover requested");
  }
  if (action === "cancel") {
    await save({ [`schedule.${date}.${pos}.coverRequested`]: false }, "Request cancelled");
  }
  if (action === "take") {
    const from = slot?.person;
    const msg = from ? `Cover ${from} on ${pos} for ${fmtShort(date)}?` : `Take ${pos} on ${fmtShort(date)}?`;
    if (!confirm(msg)) return;
    await save({
      [`schedule.${date}.${pos}`]: { person: user, coverRequested: false, coveredFor: from || null }
    }, "You're on the schedule");
  }
});

$("generate").addEventListener("click", async () => {
  const mo = current();
  if (mo.schedule && !confirm("Remake this month's schedule? Any covers already arranged will be replaced.")) return;
  const sched = bestSchedule(sundaysOf(monthKey), mo.absences || {}, tally(all, monthKey));
  await save({ schedule: sched, generatedAt: new Date().toISOString() }, "Schedule created");
});

$("user").innerHTML += PEOPLE.map(p => `<option>${p}</option>`).join("");
$("user").value = PEOPLE.includes(user) ? user : "";
$("user").addEventListener("change", e => {
  user = e.target.value;
  try { localStorage.setItem("mediaTeamUser", user); } catch {}
  render();
});
$("prev").addEventListener("click", () => { monthKey = shiftMonth(monthKey, -1); render(); });
$("next").addEventListener("click", () => { monthKey = shiftMonth(monthKey, 1); render(); });

/* ---------- Start ---------- */
if (USE_FIREBASE) {
  try { store = await firebaseStore(); }
  catch (e) { toast("Couldn't connect to Firebase. Using this browser only.", true); store = localStore(); }
} else {
  $("banner").innerHTML = `<div class="banner">Demo mode: data is saved only in this browser. Add your Firebase settings to share the schedule with the team.</div>`;
  store = localStore();
}
store.subscribe(data => { all = data; render(); });
render();
</script>
</body>
</html>
